<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0%" stop-color="#f7e9b0"/>
      <stop offset="45%" stop-color="#d6b14a"/>
      <stop offset="100%" stop-color="#8a6217"/>
    </linearGradient>
    <linearGradient id="fs" x1="0" y1="0" x2="64" y2="0">
      <stop offset="0%" stop-color="#a8abad"/>
      <stop offset="50%" stop-color="#dfe1e3"/>
      <stop offset="100%" stop-color="#6a6d70"/>
    </linearGradient>
  </defs>

  <!-- Fundo preto/carvão quadrado -->
  <rect width="64" height="64" rx="12" fill="#0a0a0a"/>
  <rect width="64" height="64" rx="12" fill="none" stroke="#2a2a2a" stroke-width="1.5"/>

  <!-- Emblema: coroa quebrada -->
  <!-- Base -->
  <rect x="11" y="42" width="42" height="6" rx="1" fill="url(#fg)"/>
  <!-- Corpo da coroa -->
  <path d="M11 42 L11 26 L19 33 L26 21 L32 28 L38 21 L45 33 L53 26 L53 42 Z" fill="url(#fg)" stroke="#4d340d" stroke-width="1"/>
  <!-- Gem central -->
  <circle cx="32" cy="27" r="3" fill="#f7e9b0" stroke="#4d340d" stroke-width="0.8"/>
  <!-- Ponta direita quebrada (prata) -->
  <path d="M53 26 L58 18 L52 22 Z" fill="url(#fs)"/>
  <path d="M53 26 L49 28" stroke="#0a0a0a" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Rachadura -->
  <path d="M30 23 L31 30 L29 34" stroke="#3a2706" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Brilho metálico suave -->
  <path d="M16 34 L23 24" stroke="#fffdf2" stroke-width="1.2" stroke-linecap="round" opacity="0.35"/>
</svg>
